services:
  # Frontend React avec Vite
  - type: web
    name: qcm-frontend
    runtime: node
    plan: free
    buildCommand: bash render-build.sh
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
