<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="qg" x1="140" y1="110" x2="380" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a99cff"/>
      <stop offset="0.55" stop-color="#7b74f8"/>
      <stop offset="1" stop-color="#5b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#5b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="#08080f"/>
  <circle cx="248" cy="242" r="180" fill="url(#glow)"/>

  <!-- Anneau du Q -->
  <circle cx="240" cy="238" r="132" fill="none" stroke="url(#qg)" stroke-width="56"/>
  <!-- Queue du Q -->
  <line x1="322" y1="320" x2="392" y2="392" stroke="url(#qg)" stroke-width="56" stroke-linecap="round"/>

  <!-- Coche de validation -->
  <path d="M182 240 l40 46 l78 -92"
