<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="440" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9184f8"/>
      <stop offset="0.55" stop-color="#7a68f4"/>
      <stop offset="1" stop-color="#6a58ef"/>
    </linearGradient>
    <clipPath id="lens">
      <circle cx="230" cy="252" r="150"/>
    </clipPath>
  </defs>

  <!-- Fond arrondi violet -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#08080f"/>
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#bg)"/>

  <!-- Manche de la loupe -->
  <line x1="332" y1="352" x2="436" y2="456" stroke="#ffffff" stroke-width="56" stroke-linecap="round"/>

  <!-- Lentille blanche -->
  <circle cx="230" cy="252" r="150" fill="#f6f5ff"/>

  <!-- Contenu de la lentille -->
  <g clip-path="url(#lens)">
    <!-- Checklist -->
    <circle cx="188" cy="250" r="9" fill="#6d5cf6"/>
    <rect x="208" y="242" width="92" height="16" rx="8" fill="#6d5cf6" opacity="0.55"/>
    <circle cx="188" cy="292" r="9" fill="#6d5cf6"/>
    <rect x="208" y="284" width="92" height="16" rx="8" fill="#6d5cf6" opacity="0.55"/>
    <!-- Coche de validation -->
    <path d="M180 300 l42 46 l96 -110"
          fill="none" stroke="#4f46e5" stroke-width="38"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Chapeau de diplômé -->
  <path d="M232 104 L366 160 L232 216 L98 160 Z" fill="#ffffff"/>
  <path d="M192 178 L272 178 L272 200 Q272 244 232 244 Q192 244 192 200 Z" fill="#ffffff" opacity="0.92"/>
  <line x1="356" y1="162" x2="356" y2="202" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <circle cx="356" cy="210" r="9" fill="#ffffff"/>
</svg>
